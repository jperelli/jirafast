[package]
name = "jirafast"
version = "0.1.0"
description = "A very fast desktop client for Jira Server / Data Center"
authors = ["Julian Perelli"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "jirafast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls", "http2"] }
tokio = { version = "1", features = ["sync", "fs"] }
thiserror = "2"
base64 = "0.22"
url = "2"
log = "0.4"
env_logger = "0.11"
tauri-plugin-clipboard-manager = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
